       30 permit ip 10.20.30.0 0.0.0.255 any
       40 permit ip 10.20.99.0 0.0.0.255 any
       50 permit ip host 10.20.255.1 any
       60 permit ip host 198.51.100.6 any
       70 deny ip any any log
      ip access-list extended WAN-IN
       10 remark Allow IPsec and ESP from OLY-R1. Deny any other device
       10 permit udp host 203.0.113.6 host 203.0.113.2 eq isakmp
       20 permit udp host 203.0.113.6 host 203.0.113.2 eq non500-isakmp
       30 permit esp host 203.0.113.6 host 203.0.113.2
       40 deny udp any host 203.0.113.2 eq isakmp log
       50 deny udp any host 203.0.113.2 eq non500-isakmp log
       60 deny esp any host 203.0.113.2 log
       70 remark Block Private IP space traffic from entering via WAN
       70 deny ip 10.0.0.0 0.255.255.255 any log
       80 deny ip 172.16.0.0 0.15.255.255 any log
       90 deny ip 192.168.0.0 0.0.255.255 any log
       100 deny ip any 10.0.0.0 0.255.255.255 log
       110 deny ip any 172.16.0.0 0.15.255.255 log
       120 deny ip any 192.168.0.0 0.0.255.255 log
       130 remark Avoid FW spoofing attempts from outside
       130 deny ip 198.51.100.0 0.0.0.7 any log
       140 remark Port forwarding for authorized ssh access to internal resources
       140 permit tcp host 198.51.100.10 host 203.0.113.2 eq 2222
       150 deny tcp any host 203.0.113.2 eq 2222 log
       160 remark Allow internet traffic
       160 permit ip any any
      ip access-list extended WAN-OUT
       10 remark Block Private IP space traffic from leaving via WAN
       10 deny ip 10.0.0.0 0.255.255.255 any log
       20 deny ip 172.16.0.0 0.15.255.255 any log
       30 deny ip 192.168.0.0 0.0.255.255 any log
       40 deny ip any 10.0.0.0 0.255.255.255 log
       50 deny ip any 172.16.0.0 0.15.255.255 log
       60 deny ip any 192.168.0.0 0.0.255.255 log
       70 remark Allow internet traffic
       70 permit ip any any
